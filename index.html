<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cherry Bourbon BBQ Competition Menü</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Menü Navigation">
        <div>
          <p class="eyebrow">BBQ Auswahl</p>
          <h1>Cherry Bourbon BBQ Competition Menü</h1>
        </div>

        <nav class="quick-nav" aria-label="Direkt zu den Gängen">
          <button type="button" data-target="menuekarte">Menü</button>
          <button type="button" data-target="vorspeise">Vorspeise</button>
          <button type="button" data-target="hauptgang">Hauptgang</button>
          <button type="button" data-target="beilage">Beilage</button>
          <button type="button" data-target="desert">Desert</button>
        </nav>
      </header>

      <section class="menu-reader" aria-label="Swipebares BBQ Menü">
        <div class="reader-actions" aria-label="Blättern">
          <button class="icon-button" type="button" data-direction="-1" aria-label="Vorherige Seite">
            ‹
          </button>
          <p id="reader-status">Menükarte 1 von 5</p>
          <button class="icon-button" type="button" data-direction="1" aria-label="Nächste Seite">
            ›
          </button>
        </div>

        <div class="slide-track" tabindex="0">
          <article class="slide" id="menuekarte" data-title="Menükarte">
            <div class="image-stage menu-stage">
              <img
                src="assets/menuekarte.png"
                alt="Cherry Bourbon BBQ Competition Menükarte mit Vorspeise, Hauptgang, Beilage und Desert"
              />
              <div class="menu-hotspots" aria-label="Menükarte Bereiche">
                <button type="button" data-target="vorspeise">Vorspeise</button>
                <button type="button" data-target="hauptgang">Hauptgang</button>
                <button type="button" data-target="beilage">Beilage</button>
                <button type="button" data-target="desert">Desert</button>
              </div>
            </div>
          </article>

          <article class="slide" id="vorspeise" data-title="Vorspeise">
            <div class="image-stage">
              <img
                src="assets/vorspeise.png"
                alt="Smoked Camembert Crostini mit Cherry-Chili-Relish Rezeptkarte"
              />
            </div>
          </article>

          <article class="slide" id="hauptgang" data-title="Hauptgang">
            <div class="image-stage">
              <img
                src="assets/hauptgang.png"
                alt="Cherry Bourbon Ribs High-End Competition Style Rezeptkarte"
              />
            </div>
          </article>

          <article class="slide" id="beilage" data-title="Beilage">
            <div class="image-stage">
              <img
                src="assets/beilage.png"
                alt="Limetten-Fenchel-Slaw mit gegrilltem Mais, Apfel, Jalapeño und Kirsch-Crunch Rezeptkarte"
              />
            </div>
          </article>

          <article class="slide" id="desert" data-title="Desert">
            <div class="image-stage">
              <img
                src="assets/desert.png"
                alt="Bourbon Cherry Cobbler vom Grill mit Vanillecreme Rezeptkarte"
              />
            </div>
          </article>
        </div>

        <div class="progress-dots" aria-label="Seiten">
          <button type="button" data-target="menuekarte" aria-label="Menükarte anzeigen"></button>
          <button type="button" data-target="vorspeise" aria-label="Vorspeise anzeigen"></button>
          <button type="button" data-target="hauptgang" aria-label="Hauptgang anzeigen"></button>
          <button type="button" data-target="beilage" aria-label="Beilage anzeigen"></button>
          <button type="button" data-target="desert" aria-label="Desert anzeigen"></button>
        </div>
      </section>
    </main>

    <script>
      const track = document.querySelector(".slide-track");
      const slides = [...document.querySelectorAll(".slide")];
      const statusText = document.querySelector("#reader-status");
      const navButtons = [...document.querySelectorAll("[data-target]")];
      const directionButtons = [...document.querySelectorAll("[data-direction]")];

      function getActiveIndex() {
        const trackLeft = track.getBoundingClientRect().left;
        return slides.reduce((closest, slide, index) => {
          const distance = Math.abs(slide.getBoundingClientRect().left - trackLeft);
          return distance < closest.distance ? { index, distance } : closest;
        }, { index: 0, distance: Infinity }).index;
      }

      function goToSlide(target) {
        const slide = document.getElementById(target);
        if (!slide) return;
        slide.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
      }

      function updateReader() {
        const activeIndex = getActiveIndex();
        const activeSlide = slides[activeIndex];
        const activeId = activeSlide.id;
        statusText.textContent = `${activeSlide.dataset.title} ${activeIndex + 1} von ${slides.length}`;

        navButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.target === activeId);
        });
      }

      navButtons.forEach((button) => {
        button.addEventListener("click", () => goToSlide(button.dataset.target));
      });

      directionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const nextIndex = Math.min(
            slides.length - 1,
            Math.max(0, getActiveIndex() + Number(button.dataset.direction)),
          );
          goToSlide(slides[nextIndex].id);
        });
      });

      track.addEventListener("scroll", () => window.requestAnimationFrame(updateReader));
      track.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          event.preventDefault();
          directionButtons[1].click();
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          directionButtons[0].click();
        }
      });

      updateReader();
    </script>
  </body>
</html>
